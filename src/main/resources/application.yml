# =====================================================================
# CONFIGURACIÓN SPRING BOOT - SISTEMA DE INVENTARIO Y VENTAS
# =====================================================================

spring:
  application:
    name: inventory-system

  # -----------------------------------------------------
  # Configuración de Base de Datos
  # -----------------------------------------------------
  datasource:
    # PostgreSQL (Producción)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000

  # -----------------------------------------------------
  # Configuración JPA / Hibernate
  # -----------------------------------------------------
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate  # En producción usar 'validate', en desarrollo 'update'
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          lob:
            non_contextual_creation: true
        generate_statistics: false

  # -----------------------------------------------------
  # Configuración Flyway (Migraciones)
  # -----------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "Initial schema"
    validate-on-migrate: true
    out-of-order: false

  # -----------------------------------------------------
  # Configuración de Servlet (Multipart para upload de imágenes)
  # -----------------------------------------------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB
      file-size-threshold: 2KB

  # -----------------------------------------------------
  # Configuración de Jackson (Serialización JSON)
  # -----------------------------------------------------
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
      adjust-dates-to-context-time-zone: true
    default-property-inclusion: non_null

# =====================================================================
# Configuración del Servidor
# =====================================================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  forward-headers-strategy: native

# =====================================================================
# Configuración de Actuator (Monitoreo)
# =====================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# =====================================================================
# Configuración de OpenAPI / Swagger
# =====================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  packages-to-scan: com.inventory.system.controller
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

# =====================================================================
# Configuración de Logging
# =====================================================================
logging:
  level:
    com.inventory.system: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/inventory-system.log
    max-size: 10MB
    max-history: 30

# =====================================================================
# Configuración Personalizada de la Aplicación
# =====================================================================
app:
  # Configuración de JWT
  jwt:
    secret: ${JWT_SECRET:mySecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmSecurity}
    expiration: 86400000 # 24 horas en milisegundos
    refresh-expiration: 604800000 # 7 días en milisegundos

  # Configuración de Paginación
  pagination:
    default-page-size: 20
    max-page-size: 100

  # Configuración de Stock
  stock:
    default-minimo: 5
    alerta-low-stock-porcentaje: 0.2 # 20% del stock máximo

  # Configuración de Número de Venta
  venta:
    numero-prefijo: "VTA"
    numero-formato: "VTA-yyyyMMdd-%04d"

  # Configuración de CORS
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600