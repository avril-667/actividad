# =====================================================================
# CONFIGURACIÓN DE DESARROLLO - H2 Database
# =====================================================================

spring:

  # -----------------------------------------------------
  # H2 Database (Desarrollo / Testing)
  # -----------------------------------------------------
  datasource:
    url: jdbc:h2:mem:inventory_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10

  # -----------------------------------------------------
  # JPA para H2
  # -----------------------------------------------------
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # -----------------------------------------------------
  # H2 Console (Acceso en /h2-console)
  # -----------------------------------------------------
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # -----------------------------------------------------
  # Flyway deshabilitado en dev (Hibernate crea las tablas)
  # -----------------------------------------------------
  flyway:
    enabled: false

# -----------------------------------------------------
# Logging más verbose en desarrollo
# -----------------------------------------------------
logging:
  level:
    com.inventory.system: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE